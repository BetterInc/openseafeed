[workspace]
resolver = "2"
members = [
    "crates/nmea",
    "crates/ais",
    "crates/feed",
    "crates/geo",
    "crates/keys",
    "services/ingest",
    "services/pipeline",
    "services/fanout",
    "services/snapshotter",
    "services/control",
    "worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/openseafeed/openseafeed"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-nats = "0.38"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
openseafeed-ais = { path = "crates/ais" }
openseafeed-nmea = { path = "crates/nmea" }
openseafeed-feed = { path = "crates/feed" }
openseafeed-geo = { path = "crates/geo" }

[profile.release]
lto = "thin"
strip = true
