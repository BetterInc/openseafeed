# Stateless decoder/validator/deduper. Horizontally scalable via the NATS
# queue group — add replicas freely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline
  labels:
    app: pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pipeline
  template:
    metadata:
      labels:
        app: pipeline
    spec:
      containers:
        - name: pipeline
          image: ghcr.io/openseafeed/openseafeed:latest
          command: ["openseafeed-pipeline"]
          envFrom:
            - configMapRef:
                name: openseafeed-env
          env:
            - name: OSF_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openseafeed-secrets
                  key: OSF_INTERNAL_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
