# EXAMPLE ONLY — do not commit real secrets.
#
# Copy to secret.yaml, fill in real values, and apply out-of-band:
#   kubectl -n openseafeed apply -f secret.yaml
# secret.yaml is gitignored. In production prefer a sealed-secrets / external
# secrets operator over a plaintext manifest.
#
# Required keys:
#   OSF_INTERNAL_TOKEN        shared token for service-to-service auth
#   OSF_SESSION_SECRET        cookie/session signing secret (control)
#   OSF_GITHUB_CLIENT_ID      GitHub OAuth app client id
#   OSF_GITHUB_CLIENT_SECRET  GitHub OAuth app client secret
#   OSF_GOOGLE_CLIENT_ID      Google OAuth client id
#   OSF_GOOGLE_CLIENT_SECRET  Google OAuth client secret
#   OSF_FEED_KEY_NORWAY       feed key the norway worker presents to ingest
#   OSF_CLICKHOUSE_PASSWORD   ClickHouse password for the `osf` user (server + archiver)
apiVersion: v1
kind: Secret
metadata:
  name: openseafeed-secrets
type: Opaque
stringData:
  OSF_INTERNAL_TOKEN: "replace-me"
  OSF_SESSION_SECRET: "replace-me"
  OSF_GITHUB_CLIENT_ID: "replace-me"
  OSF_GITHUB_CLIENT_SECRET: "replace-me"
  OSF_GOOGLE_CLIENT_ID: "replace-me"
  OSF_GOOGLE_CLIENT_SECRET: "replace-me"
  OSF_FEED_KEY_NORWAY: "replace-me"
  OSF_CLICKHOUSE_PASSWORD: "replace-me"
