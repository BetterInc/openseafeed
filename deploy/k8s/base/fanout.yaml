# Live WebSocket stream (/v1/stream). Horizontally scalable; HPA target.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fanout
  labels:
    app: fanout
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fanout
  template:
    metadata:
      labels:
        app: fanout
    spec:
      containers:
        - name: fanout
          image: ghcr.io/openseafeed/openseafeed:latest
          command: ["openseafeed-fanout"]
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: openseafeed-env
          env:
            - name: OSF_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openseafeed-secrets
                  key: OSF_INTERNAL_TOKEN
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              # Each replica holds the seed fleet (every vessel, pre-rendered
              # as the frame a new subscriber is warmed with) - a few hundred
              # bytes x ~150k vessels, plus the refresh's transient copy.
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fanout
  labels:
    app: fanout
spec:
  type: ClusterIP
  selector:
    app: fanout
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fanout
  labels:
    app: fanout
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fanout
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
