# Feed connector: Finland (Digitraffic public MQTT/WSS). A separate worker
# process, one per upstream feed, pushing into the in-cluster ingest ClusterIP.
# Independent of the platform — the same binary runs on a VPS or Pi just as well
# (see docs/connectors.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-finland
  labels:
    app: worker-finland
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-finland
  template:
    metadata:
      labels:
        app: worker-finland
    spec:
      containers:
        - name: worker
          image: ghcr.io/openseafeed/openseafeed:latest
          command:
            - openseafeed-worker
            - connect
            - --upstream
            - finland
            - --ingest
            - tcp://ingest:10111
            - --key
            - $(OSF_FEED_KEY)
          env:
            - name: RUST_LOG
              value: info
            - name: OSF_FEED_KEY
              valueFrom:
                secretKeyRef:
                  name: openseafeed-secrets
                  key: OSF_FEED_KEY_FINLAND
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
