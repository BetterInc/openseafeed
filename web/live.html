<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenSeaFeed - live</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: #0b1420; color: #cfe3f5;
         font: 14px/1.45 system-ui, sans-serif; }
  .osf-nav { display: flex; gap: 1.5rem; align-items: baseline; padding: .8rem 1.5rem;
             border-bottom: 1px solid #1d3242; background: #0b1420; }
  .osf-nav .brand { font-size: 1.05rem; font-weight: 600; letter-spacing: .04em;
                    color: #7fd4a8; text-decoration: none; }
  .osf-nav nav { margin-left: auto; display: flex; gap: 1.25rem; font-size: .95rem; }
  .osf-nav nav a { text-decoration: none; color: #9fb8cd; }
  .osf-nav nav a:hover, .osf-nav nav a.active { color: #7fd4a8; }
  #statsbar { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: baseline;
              padding: .5rem 1rem; border-bottom: 1px solid #1d3242; font-size: 13px; }
  .stat b { color: #fff; font-variant-numeric: tabular-nums; }
  .stat span, label { color: #7f9ab0; }
  #controls { margin-left: auto; display: flex; gap: .75rem; align-items: center; }
  input[type=text] { background: #0e1b2a; color: #cfe3f5; border: 1px solid #24455f;
          border-radius: 4px; padding: .25rem .5rem; width: 13rem; font: inherit; }
  button { background: #14532d; color: #d6ffe4; border: 1px solid #1f7a44; border-radius: 4px;
           padding: .25rem .9rem; font: inherit; cursor: pointer; }
  button:hover { background: #1a6b3a; }
  #map { flex: 1; }
  .maplibregl-popup-content { background: #0e1b2a; color: #cfe3f5; border: 1px solid #24455f;
      font: 13px/1.5 system-ui, sans-serif; padding: .6rem .8rem; }
  .maplibregl-popup-tip { border-top-color: #24455f; }
  .maplibregl-popup-content b { color: #7fd4a8; }
  .maplibregl-popup-content a { color: #7fd4a8; }
  .maplibregl-popup-content img { max-width: 100%; border-radius: 4px;
      margin-top: .4rem; display: block; }
  .maplibregl-popup-content .credit { font-size: 11px; color: #7f9ab0; }
  .maplibregl-popup-close-button { color: #7f9ab0; z-index: 1; }
  #detail { position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 100%);
            background: rgba(11,20,32,.97); border-left: 1px solid #1d3242; z-index: 10;
            overflow-y: auto; padding: 1rem; display: none; }
  #detail.open { display: block; }
  #detail h2 { color: #7fd4a8; font-size: 1.15rem; margin-bottom: .15rem; }
  #detail .sub { color: #7f9ab0; font-size: 12px; margin-bottom: .6rem; }
  #detail img { max-width: 100%; border-radius: 6px; margin: .5rem 0 .15rem; display: block; }
  #detail table { width: 100%; border-collapse: collapse; margin-top: .6rem; font-size: 13px; }
  #detail td { padding: .3rem 0; border-bottom: 1px solid #16283a; vertical-align: top; }
  #detail td:first-child { color: #7f9ab0; width: 42%; }
  #detail .back { display: inline-block; margin-bottom: .7rem; color: #7fd4a8; cursor: pointer;
                  background: none; border: none; padding: 0; font: inherit; }
  #detail .back:hover { text-decoration: underline; }
  #detail .credit { font-size: 11px; color: #7f9ab0; }
  #searchwrap { position: relative; }
  #search { width: 15rem; }
  #results { position: absolute; top: 2.2rem; left: 0; right: 0; background: #0e1b2a;
             border: 1px solid #24455f; border-radius: 6px; z-index: 20;
             max-height: 300px; overflow-y: auto; display: none; }
  #results div { padding: .35rem .6rem; cursor: pointer; font-size: .9rem; }
  #results div:hover { background: #16283a; }
  #results .m { color: #7f9ab0; }
  #legend { position: absolute; bottom: 2.2rem; left: .75rem; z-index: 5;
            background: rgba(11,20,32,.85); border: 1px solid #1d3242; border-radius: 6px;
            padding: .5rem .75rem; color: #7f9ab0; font-size: 12px; }
  #legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
              margin-right: .35rem; vertical-align: -1px; }
</style>
</head>
<body>
<header class="osf-nav">
  <a class="brand" href="https://openseafeed.com/">OPENSEAFEED</a>
  <nav>
    <a href="https://openseafeed.com/">Home</a>
    <a class="active" href="https://stream.openseafeed.com/">Live map</a>
    <a href="https://openseafeed.com/docs.html">API docs</a>
    <a href="https://openseafeed.com/account.html">Account</a>
  </nav>
</header>
<div id="statsbar">
  <div class="stat"><b id="rate">0</b> <span>msg/s</span></div>
  <div class="stat"><b id="total">0</b> <span>messages</span></div>
  <div class="stat"><b id="vessels">0</b> <span>vessels seen</span></div>
  <div class="stat"><span id="status">disconnected</span></div>
  <div id="controls">
    <span id="searchwrap">
      <input type="text" id="search" placeholder="search name or MMSI" autocomplete="off">
      <div id="results"></div>
    </span>
    <label><input type="checkbox" id="seamarks"> seamarks</label>
    <label><input type="checkbox" id="coverage"> coverage</label>
    <button id="go">connect</button>
  </div>
</div>
<div id="map"></div>
<div id="legend">
  <span style="color:#8fa3b0">&#9650;</span> under way - <i style="background:#8fa3b0"></i>stationary - fades with age<br>
  <i style="background:#4fc06f"></i>cargo&ensp;
  <i style="background:#e05252"></i>tanker&ensp;
  <i style="background:#4f9fe8"></i>passenger&ensp;
  <i style="background:#e8a54f"></i>fishing<br>
  <i style="background:#b98ae8"></i>sailing / pleasure&ensp;
  <i style="background:#e8d94f"></i>tug / pilot / SAR&ensp;
  <i style="background:#5fd8d2"></i>high-speed&ensp;
  <i style="background:#8fa3b0"></i>other
</div>
<aside id="detail">
  <button class="back" id="d-back">&lt;- back to map</button>
  <h2 id="d-name"></h2>
  <div class="sub" id="d-sub"></div>
  <div id="d-photo"></div>
  <table id="d-table"></table>
</aside>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
"use strict";
const map = new maplibregl.Map({
  container: "map",
  center: [10, 45],
  zoom: 3,
  attributionControl: { compact: true },
  style: {
    version: 8,
    sources: {
      base: {
        type: "raster",
        tiles: ["https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png"],
        tileSize: 256,
        attribution: "&copy; OpenStreetMap contributors &copy; CARTO - seamarks &copy; OpenSeaMap",
      },
      seamark: {
        type: "raster",
        tiles: ["https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png"],
        tileSize: 256,
      },
      vessels: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
      trail: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
    },
    layers: [
      { id: "base", type: "raster", source: "base" },
      { id: "seamark", type: "raster", source: "seamark",
        layout: { visibility: "none" } },
      // Track of the vessel currently open in the detail panel, drawn from
      // the positions received while the panel is open.
      { id: "trail", type: "line", source: "trail",
        paint: { "line-color": "#7fd4a8", "line-width": 1.5, "line-opacity": 0.7 } },
      // Stationary vessels: dots. Color = ship-type category (see
      // CAT_COLORS below, kept in sync by buildColorExpr); opacity = age.
      { id: "vessels", type: "circle", source: "vessels",
        filter: ["!=", ["get", "moving"], 1],
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 3, 1.6, 8, 3.5, 12, 6],
          "circle-color": ["match", ["get", "cat"],
            1, "#4fc06f", 2, "#e05252", 3, "#4f9fe8", 4, "#e8a54f",
            5, "#b98ae8", 6, "#e8d94f", 7, "#5fd8d2", "#8fa3b0"],
          "circle-opacity": ["step", ["get", "age"], 0.95, 10, 0.65, 120, 0.35, 3600, 0.18],
        } },
      // Under-way vessels: arrows rotated to course over ground.
      { id: "vessels-moving", type: "symbol", source: "vessels",
        filter: ["==", ["get", "moving"], 1],
        layout: {
          "icon-image": "arrow",
          // The source image is 48px; arrows run ~2x the dot size so
          // under-way traffic clearly stands out from anchored bullets.
          "icon-size": ["interpolate", ["linear"], ["zoom"], 3, 0.15, 8, 0.28, 12, 0.45],
          "icon-rotate": ["get", "rot"],
          "icon-rotation-alignment": "map",
          "icon-allow-overlap": true,
          "icon-ignore-placement": true,
        },
        paint: {
          "icon-color": ["match", ["get", "cat"],
            1, "#4fc06f", 2, "#e05252", 3, "#4f9fe8", 4, "#e8a54f",
            5, "#b98ae8", 6, "#e8d94f", 7, "#5fd8d2", "#8fa3b0"],
          "icon-opacity": ["step", ["get", "age"], 0.95, 10, 0.65, 120, 0.35, 3600, 0.18],
        } },
    ],
  },
});

// North-pointing arrow, generated at runtime as an SDF so icon-color tints
// it per-vessel.
map.on("load", () => {
  const s = 48, c = document.createElement("canvas");
  c.width = c.height = s;
  const g = c.getContext("2d");
  g.fillStyle = "#fff";
  g.beginPath();
  g.moveTo(s / 2, 5);        // tip
  g.lineTo(s - 11, s - 8);   // starboard tail
  g.lineTo(s / 2, s - 16);   // notch
  g.lineTo(11, s - 8);       // port tail
  g.closePath();
  g.fill();
  map.addImage("arrow", g.getImageData(0, 0, s, s), { sdf: true });
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }));

document.getElementById("seamarks").onchange = (e) =>
  map.setLayoutProperty("seamark", "visibility", e.target.checked ? "visible" : "none");

// -- Coverage layer: where the network heard ships in the last 7 days. -----
// Shaded cells = receivers can hear there; blank sea = nobody is listening,
// which is exactly where a new receiver helps most.
const GH32 = "0123456789bcdefghjkmnpqrstuvwxyz";
function geohashBounds(g) {
  let even = true, latMin = -90, latMax = 90, lonMin = -180, lonMax = 180;
  for (const ch of g) {
    const cd = GH32.indexOf(ch);
    for (let bit = 4; bit >= 0; bit--) {
      const on = (cd >> bit) & 1;
      if (even) {
        const mid = (lonMin + lonMax) / 2;
        if (on) lonMin = mid; else lonMax = mid;
      } else {
        const mid = (latMin + latMax) / 2;
        if (on) latMin = mid; else latMax = mid;
      }
      even = !even;
    }
  }
  return [lonMin, latMin, lonMax, latMax];
}

let coverageLoaded = false;
document.getElementById("coverage").onchange = async (e) => {
  if (!e.target.checked) {
    if (map.getLayer("coverage")) map.setLayoutProperty("coverage", "visibility", "none");
    return;
  }
  if (coverageLoaded) {
    map.setLayoutProperty("coverage", "visibility", "visible");
    return;
  }
  try {
    const r = await fetch(`${API_BASE}/v1/coverage`);
    const cov = await r.json();
    const features = (cov.cells || []).map((c) => {
      const [w, s, e2, n] = geohashBounds(c.g);
      return { type: "Feature",
        properties: { ships: c.ships },
        geometry: { type: "Polygon",
          coordinates: [[[w, s], [e2, s], [e2, n], [w, n], [w, s]]] } };
    });
    map.addSource("coverage", { type: "geojson",
      data: { type: "FeatureCollection", features } });
    map.addLayer({
      id: "coverage", type: "fill", source: "coverage",
      paint: {
        "fill-color": ["step", ["get", "ships"],
          "#16324a", 10, "#1d4a66", 50, "#1f6a80", 200, "#27908c"],
        "fill-opacity": 0.35,
        "fill-outline-color": "rgba(0,0,0,0)",
      },
    }, "trail"); // under the vessels and the track
    coverageLoaded = true;
  } catch (err) {
    e.target.checked = false;
  }
};

const seen = new Map(); // mmsi -> {lon, lat, t(ms), name, sog, cog, type, stype}
let total = 0, windowCount = 0;
let ws = null;
// Detail-panel state, hoisted: refresh()/repaint run at parse time and read
// detailMmsi (ghost pruning spares the vessel being inspected).
let detailMmsi = null;
let trail = [];
let photoKey = ""; // `${mmsi}:${imo}` of the last photo request

// ITU ship-type code -> category index; keep in sync with the layer "match"
// expressions and the legend.
const CAT_NAMES = ["vessel", "cargo", "tanker", "passenger", "fishing",
                   "sailing / pleasure", "tug / pilot / SAR", "high-speed craft"];
function typeCat(t) {
  if (t == null) return 0;
  if (t >= 70 && t <= 79) return 1;
  if (t >= 80 && t <= 89) return 2;
  if (t >= 60 && t <= 69) return 3;
  if (t === 30) return 4;
  if (t === 36 || t === 37) return 5;
  if (t >= 50 && t <= 59) return 6;
  if (t >= 40 && t <= 49) return 7;
  return 0;
}

// In production one hostname fronts every read API (api.<domain>, path-routed
// at the edge), and all of them answer with CORS open so this page can call
// them from the stream host. In dev there is no edge: each service listens on
// its own port, so the paths split across them.
const EDGE = location.host.startsWith("stream.");
const API_ORIGIN = location.origin.replace("//stream.", "//api.");
const API_BASE = EDGE ? API_ORIGIN : "http://localhost:8083";   // control: photos
const SNAP_BASE = EDGE ? API_ORIGIN : "http://localhost:8082";  // snapshotter
const HIST_BASE = EDGE ? API_ORIGIN : "http://localhost:8084";  // archiver

const NAV_STATUS = ["under way (engine)", "at anchor", "not under command",
  "restricted manoeuvrability", "constrained by draught", "moored", "aground",
  "fishing", "under way (sailing)", "reserved", "reserved", "towing astern",
  "towing alongside", "reserved", "AIS-SART", "undefined"];

// Fetch the free-licensed photo (Wikidata/Commons via the control plane)
// into `box`, DOM-built so nothing from the network is injected as HTML.
function loadPhoto(box, mmsi, imo) {
  fetch(`${API_BASE}/v1/photos/${mmsi}${imo ? `?imo=${imo}` : ""}`)
    .then((r) => r.json())
    .then((ph) => {
      if (!box.isConnected || !ph.found) return;
      const img = document.createElement("img");
      img.src = ph.image_url;
      const credit = document.createElement("a");
      credit.href = ph.page_url;
      credit.target = "_blank";
      credit.rel = "noopener";
      credit.textContent = "photo - Wikimedia Commons";
      credit.className = "credit";
      box.replaceChildren(img, credit);
    })
    .catch(() => {});
}

// The proxy already holds the fleet - paint it before the first live message
// arrives. Without this the map starts empty on every load and fills in over
// the ~10 minutes it takes the world to transmit once, which is why our own
// window on the feed looked emptier than clients that cache their own state.
// Positions carry their real age, so anything stale renders as a faded dot
// until its next broadcast lands.
function loadFleet() {
  fetch(`${SNAP_BASE}/v1/snapshot`)
    .then((r) => (r.ok ? r.json() : null))
    .then((snap) => {
      if (!snap || !Array.isArray(snap.vessels)) return;
      for (const sv of snap.vessels) {
        if (typeof sv.lat !== "number" || typeof sv.lon !== "number") continue;
        if (!sv.lat && !sv.lon) continue;
        if (seen.has(sv.mmsi)) continue; // a live message already beat us to it
        seen.set(sv.mmsi, {
          lon: sv.lon, lat: sv.lat, t: sv.ts || Date.now(),
          name: sv.name || "", sog: sv.sog, cog: sv.cog, heading: sv.hdg,
          navStatus: sv.nav, type: "snapshot", stype: sv.type, imo: sv.imo,
          info: { callsign: sv.callsign, destination: sv.dest, draught: sv.draught,
                  length: sv.len, beam: sv.beam, eta: sv.eta },
        });
      }
      refresh();
    })
    .catch(() => {});
}

// A ship silent this long is no longer "there" - drop its dot instead of
// showing history as presence. (The detail panel still finds it via the
// server-side snapshot and history.)
const SILENT_DROP_MS = 60 * 60 * 1000;

function refresh() {
  const now = Date.now();
  const features = [];
  for (const [mmsi, v] of seen) {
    if (now - v.t > SILENT_DROP_MS && mmsi !== detailMmsi) { seen.delete(mmsi); continue; }
    // Under way = making way over ground with a usable direction; heading
    // beats course when both exist (it's what the ship actually points at).
    const rot = v.heading != null ? v.heading : v.cog;
    const moving = v.sog != null && v.sog >= 0.5 && rot != null ? 1 : 0;
    features.push({
      type: "Feature",
      geometry: { type: "Point", coordinates: [v.lon, v.lat] },
      properties: { mmsi, age: (now - v.t) / 1000, name: v.name || "",
                    sog: v.sog, cog: v.cog, type: v.type, moving, rot: rot || 0,
                    cat: typeCat(v.stype), stype: v.stype, imo: v.imo },
    });
  }
  const src = map.getSource("vessels");
  if (src) src.setData({ type: "FeatureCollection", features });
  document.getElementById("rate").textContent = windowCount;
  windowCount = 0;
  document.getElementById("total").textContent = total.toLocaleString();
  document.getElementById("vessels").textContent = seen.size.toLocaleString();
  if (detailMmsi != null) renderDetail(); // keep ages/position live
}
// Each repaint rebuilds the whole FeatureCollection, which is O(fleet): at
// world scale that is six figures of features, so repaint less often rather
// than spend every second of a core on it.
(function repaint() {
  refresh();
  setTimeout(repaint, seen.size > 20000 ? 3000 : 1000);
})();

for (const layer of ["vessels", "vessels-moving"]) {
  map.on("click", layer, (e) => {
    const p = e.features[0].properties;
    const esc = (s) => String(s).replace(/[<>&]/g, "");
    const kind = CAT_NAMES[p.cat] + (p.stype != null ? ` (type ${esc(p.stype)})` : "");
    const photoId = `photo-${p.mmsi}`;
    new maplibregl.Popup({ maxWidth: "280px" })
      .setLngLat(e.features[0].geometry.coordinates)
      .setHTML(
        `<b>${esc(p.name) || "unnamed"}</b><br>` +
        `MMSI ${esc(p.mmsi)} - ${kind}<br>` +
        (p.moving == 1
          ? `${esc(p.sog)} kn, course ${Math.round(p.rot)} deg<br>`
          : `stationary<br>`) +
        `${esc(p.type)} - ${Math.round(p.age)}s ago<br>` +
        `<a href="#vessel/${esc(p.mmsi)}">details -&gt;</a>` +
        `<div id="${photoId}"></div>`
      )
      .addTo(map);
    const box = document.getElementById(photoId);
    if (box) loadPhoto(box, p.mmsi, p.imo);
  });
  map.on("mouseenter", layer, () => (map.getCanvas().style.cursor = "pointer"));
  map.on("mouseleave", layer, () => (map.getCanvas().style.cursor = ""));
}

// -- Vessel detail panel (#vessel/<mmsi> hash route) -----------------------
// (declared near the top of the script: the repaint loop runs immediately
// and reads detailMmsi, so the state must exist before it.)

const dEl = document.getElementById("detail");
document.getElementById("d-back").onclick = () => { location.hash = ""; };

function fmtEta(e) {
  if (!e || !e.Month) return null;
  const p = (n) => String(n).padStart(2, "0");
  return `${p(e.Month)}-${p(e.Day)} ${p(e.Hour)}:${p(e.Minute)} UTC`;
}

function renderDetail() {
  const mmsi = detailMmsi;
  if (mmsi == null) return;
  const v = seen.get(mmsi);
  document.getElementById("d-name").textContent = (v && v.name) || "unnamed";
  const kind = v ? CAT_NAMES[typeCat(v.stype)] + (v.stype != null ? ` (type ${v.stype})` : "") : "";
  document.getElementById("d-sub").textContent = v ? `MMSI ${mmsi} - ${kind}` : `MMSI ${mmsi}`;

  const table = document.getElementById("d-table");
  table.replaceChildren();
  const row = (label, value) => {
    if (value == null || value === "") return;
    const tr = table.insertRow();
    tr.insertCell().textContent = label;
    tr.insertCell().textContent = String(value);
  };
  if (!v) {
    row("status", "waiting for this vessel's next broadcast...");
    return;
  }
  const info = v.info || {};
  row("IMO", v.imo || info.imoNumber);
  row("call sign", info.callsign);
  if (info.length) row("size", `${info.length} m x ${info.beam || "?"} m`);
  row("draught", info.draught ? `${info.draught} m` : null);
  row("destination", info.destination);
  row("ETA", fmtEta(info.eta));
  row("nav status", v.navStatus != null ? NAV_STATUS[v.navStatus] : null);
  row("speed", v.sog != null ? `${v.sog} kn` : null);
  row("course", v.cog != null ? `${Math.round(v.cog)} deg` : null);
  row("heading", v.heading != null ? `${v.heading} deg` : null);
  row("position", `${v.lat.toFixed(5)}, ${v.lon.toFixed(5)}`);
  row("last message", `${v.type} - ${Math.round((Date.now() - v.t) / 1000)}s ago`);

  // (Re)load the photo when the identity we can search with changes - e.g.
  // the IMO arriving with the ship's next statics unlocks a better lookup.
  const key = `${mmsi}:${v.imo || ""}`;
  if (key !== photoKey) {
    photoKey = key;
    const box = document.getElementById("d-photo");
    box.replaceChildren();
    loadPhoto(box, mmsi, v.imo);
  }
}

function drawTrail() {
  const src = map.getSource("trail");
  if (src && trail.length > 1) {
    src.setData({ type: "Feature", properties: {},
      geometry: { type: "LineString", coordinates: trail } });
  }
}

// Draw the vessel's stored track (the archiver keeps every position in
// ClickHouse; anonymous access covers the last 48h, downsampled). Live
// positions received while the panel is open then extend it.
function loadTrack(mmsi) {
  fetch(`${HIST_BASE}/v1/history/${mmsi}?step=60`)
    .then((r) => (r.ok ? r.json() : null))
    .then((h) => {
      if (!h || detailMmsi !== mmsi || !Array.isArray(h.points)) return;
      const pts = h.points
        .filter((pt) => typeof pt.lat === "number" && Math.abs(pt.lat) <= 90 &&
                        Math.abs(pt.lon) <= 180 && (pt.lat || pt.lon))
        .map((pt) => [pt.lon, pt.lat]);
      trail = pts.concat(trail);
      drawTrail();
    })
    .catch(() => {});
}

// Seed the panel (and the map) from the snapshotter's current state, so a
// shared #vessel link shows the ship immediately instead of waiting for its
// next broadcast. Live stream messages then take over.
function seedVessel(mmsi) {
  fetch(`${SNAP_BASE}/v1/vessels/${mmsi}`)
    .then((r) => (r.ok ? r.json() : null))
    .then((sv) => {
      if (!sv || detailMmsi !== mmsi) return;
      const prev = seen.get(mmsi) || {};
      const v = Object.assign({}, prev);
      // Position/motion: only if the snapshot is newer than what we heard.
      if ((prev.t == null || (sv.ts && sv.ts > prev.t)) && typeof sv.lat === "number") {
        v.lat = sv.lat; v.lon = sv.lon;
        if (sv.sog != null) v.sog = sv.sog;
        if (sv.cog != null) v.cog = sv.cog;
        if (sv.hdg != null) v.heading = sv.hdg;
        if (sv.nav != null) v.navStatus = sv.nav;
        v.t = sv.ts || Date.now();
        v.type = "snapshot";
      }
      if (sv.name && !v.name) v.name = sv.name;
      if (sv.type != null && v.stype == null) v.stype = sv.type;
      if (sv.imo != null && v.imo == null) v.imo = sv.imo;
      v.info = Object.assign({ callsign: sv.callsign, destination: sv.dest,
                               draught: sv.draught, length: sv.len, beam: sv.beam,
                               eta: sv.eta }, v.info);
      if (typeof v.lat !== "number") return; // nothing usable yet
      seen.set(mmsi, v);
      renderDetail();
      map.easeTo({ center: [v.lon, v.lat], zoom: Math.max(map.getZoom(), 8) });
    })
    .catch(() => {});
}

function route() {
  const mHash = location.hash.match(/^#vessel\/(\d+)$/);
  if (mHash) {
    detailMmsi = Number(mHash[1]);
    trail = [];
    photoKey = "";
    document.getElementById("d-photo").replaceChildren();
    dEl.classList.add("open");
    renderDetail();
    seedVessel(detailMmsi);
    loadTrack(detailMmsi);
    const v = seen.get(detailMmsi);
    if (v) map.easeTo({ center: [v.lon, v.lat], zoom: Math.max(map.getZoom(), 8) });
  } else {
    detailMmsi = null;
    dEl.classList.remove("open");
    const src = map.getSource("trail");
    if (src) src.setData({ type: "FeatureCollection", features: [] });
  }
}
window.addEventListener("hashchange", route);

// The map is a public window onto the network - viewers need no API key
// (fanout's anonymous tier). Keys are for API consumers and are created on
// the control plane. OpenSeaFeed is the single uplink everyone downstream
// streams off, so its own map asks for the whole world: fan-out grants
// unmetered area to its first-party origins (OSF_VIEWER_ORIGINS), while
// anonymous third-party clients keep the free tier's 30000 square degrees.
const VIEW_BBOX = [[[-90, -180], [90, 180]]];

function connect() {
  if (ws) { ws.onclose = null; ws.close(); }
  const status = document.getElementById("status");
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${scheme}://${location.host}/v1/stream`);
  status.textContent = "connecting...";
  ws.onopen = () => {
    status.textContent = "streaming";
    // No warm start over the socket: loadFleet() pulls the same vessels as
    // one gzipped, cacheable HTTP response instead.
    ws.send(JSON.stringify({ BoundingBoxes: VIEW_BBOX, InitialState: false }));
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.error) { status.textContent = "error: " + m.error; return; }
    total++; windowCount++;
    const md = m.MetaData || {};
    if (typeof md.latitude !== "number" || (!md.latitude && !md.longitude)) return;
    const prev = seen.get(md.MMSI) || {};
    const pkt = m.Message ? m.Message[m.MessageType] || {} : {};
    const heading = typeof pkt.TrueHeading === "number" && pkt.TrueHeading < 511
      ? pkt.TrueHeading : undefined;
    const v = {
      lon: md.longitude, lat: md.latitude, t: Date.now(),
      name: md.ShipName || prev.name,
      sog: typeof pkt.Sog === "number" && pkt.Sog < 102.3 ? pkt.Sog : prev.sog,
      cog: typeof pkt.Cog === "number" && pkt.Cog < 360 ? pkt.Cog : prev.cog,
      heading: heading !== undefined ? heading : prev.heading,
      type: m.MessageType,
      stype: typeof md.ShipType === "number" ? md.ShipType : prev.stype,
      imo: typeof md.IMO === "number" ? md.IMO : prev.imo,
      navStatus: typeof pkt.NavigationalStatus === "number"
        ? pkt.NavigationalStatus : prev.navStatus,
      info: prev.info,
    };
    // Static messages carry the vessel's particulars: remember them so the
    // detail panel can show everything the ship has told us.
    if (/Static|ExtendedClassB/.test(m.MessageType)) {
      // Type 24 splits its fields across ReportA (the name) and ReportB (the
      // rest) - a Class B vessel sends one half per message. Merge whichever
      // half this frame actually carried.
      const sp = m.MessageType === "StaticDataReport"
        ? Object.assign({},
            pkt.ReportA && pkt.ReportA.Valid ? pkt.ReportA : null,
            pkt.ReportB && pkt.ReportB.Valid ? pkt.ReportB : null)
        : pkt;
      const D = sp.Dimension || {};
      const len = (D.A || 0) + (D.B || 0);
      const fresh = { callsign: sp.CallSign, destination: sp.Destination,
                      draught: sp.MaximumStaticDraught, eta: sp.Eta,
                      imoNumber: sp.ImoNumber,
                      length: len || undefined,
                      beam: len ? (D.C || 0) + (D.D || 0) : undefined };
      v.info = Object.assign({}, prev.info);
      for (const [k, val] of Object.entries(fresh)) {
        if (val !== undefined && val !== null && val !== "" && val !== 0) v.info[k] = val;
      }
    }
    seen.set(md.MMSI, v);
    if (detailMmsi === md.MMSI) {
      if (typeof md.latitude === "number" && (md.latitude || md.longitude)) {
        trail.push([md.longitude, md.latitude]);
        drawTrail();
      }
      renderDetail();
    }
  };
  ws.onclose = () => { status.textContent = "disconnected - retrying in 3s"; setTimeout(connect, 3000); };
}
// -- Search: name substring or MMSI prefix over everything seen so far. ----
const searchEl = document.getElementById("search");
const resultsEl = document.getElementById("results");
let searchTimer = null;
searchEl.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 150);
});
searchEl.addEventListener("blur", () => setTimeout(() => { resultsEl.style.display = "none"; }, 200));
searchEl.addEventListener("focus", runSearch);
function runSearch() {
  const q = searchEl.value.trim().toUpperCase();
  resultsEl.replaceChildren();
  if (q.length < 2) { resultsEl.style.display = "none"; return; }
  const out = [];
  for (const [mmsi, v] of seen) {
    if (String(mmsi).startsWith(q) || (v.name || "").toUpperCase().includes(q)) {
      out.push([mmsi, v]);
      if (out.length >= 12) break;
    }
  }
  // Unknown here but a plausible MMSI: offer it anyway - the detail panel
  // seeds from the server-side snapshot, which knows more than this tab.
  if (!out.length && /^\d{7,9}$/.test(q)) out.push([Number(q), null]);
  for (const [mmsi, v] of out) {
    const d = document.createElement("div");
    if (v && v.name) d.append(v.name + " ");
    const m = document.createElement("span");
    m.className = "m";
    m.textContent = (v && v.name ? "" : "MMSI ") + mmsi
      + (v ? " - " + CAT_NAMES[typeCat(v.stype)] : " (look up)");
    d.append(m);
    d.onmousedown = () => {
      location.hash = "vessel/" + mmsi;
      searchEl.value = "";
      resultsEl.style.display = "none";
    };
    resultsEl.append(d);
  }
  resultsEl.style.display = out.length ? "block" : "none";
}

document.getElementById("go").onclick = connect;
connect();
loadFleet();
route(); // honor a #vessel/<mmsi> deep link on load
</script>
</body>
</html>
