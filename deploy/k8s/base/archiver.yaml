# Archiver: consumes ais.decoded.> from NATS and batch-inserts into ClickHouse.
# Stateless; scalable via the NATS queue group, but one replica is plenty until
# write volume demands more.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archiver
  labels:
    app: archiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archiver
  template:
    metadata:
      labels:
        app: archiver
    spec:
      containers:
        - name: archiver
          image: ghcr.io/openseafeed/openseafeed:latest
          command: ["openseafeed-archiver"]
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: openseafeed-env
          env:
            - name: OSF_HTTP_ADDR
              value: 0.0.0.0:8084
            - name: OSF_CLICKHOUSE_URL
              value: http://clickhouse:8123
            - name: OSF_CLICKHOUSE_DB
              value: osf
            - name: OSF_CLICKHOUSE_USER
              value: osf
            - name: OSF_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openseafeed-secrets
                  key: OSF_INTERNAL_TOKEN
            - name: OSF_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openseafeed-secrets
                  key: OSF_CLICKHOUSE_PASSWORD
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
