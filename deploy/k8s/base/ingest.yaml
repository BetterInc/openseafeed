apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  labels:
    app: ingest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingest
  template:
    metadata:
      labels:
        app: ingest
    spec:
      containers:
        - name: ingest
          image: ghcr.io/openseafeed/openseafeed:latest
          command: ["openseafeed-ingest"]
          ports:
            - name: udp
              containerPort: 10110
              protocol: UDP
            - name: tcp
              containerPort: 10111
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: openseafeed-env
          env:
            - name: OSF_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openseafeed-secrets
                  key: OSF_INTERNAL_TOKEN
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
# Internal HTTP (WS /v1/ingest, /healthz, /metrics) — cluster-only.
apiVersion: v1
kind: Service
metadata:
  name: ingest
  labels:
    app: ingest
spec:
  type: ClusterIP
  selector:
    app: ingest
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: tcp
      port: 10111
      targetPort: tcp
---
# Public UDP entrypoint. Mixed-protocol LoadBalancers are not portable, so UDP
# and TCP each get their own single-protocol LB Service.
apiVersion: v1
kind: Service
metadata:
  name: ingest-udp
  labels:
    app: ingest
  annotations:
    # Some clouds require an explicit annotation for UDP LBs; add per-provider
    # (e.g. Scaleway assigns a separate LB IP per Service).
    service.beta.kubernetes.io/scw-loadbalancer-forward-port-algorithm: roundrobin
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: ingest
  ports:
    - name: udp
      port: 10110
      targetPort: udp
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-tcp
  labels:
    app: ingest
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: ingest
  ports:
    - name: tcp
      port: 10111
      targetPort: tcp
      protocol: TCP
