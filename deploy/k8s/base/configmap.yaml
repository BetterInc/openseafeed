# Non-secret configuration shared by all services. Secrets (tokens, OAuth
# credentials, feed keys) live in the `openseafeed-secrets` Secret instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openseafeed-env
data:
  RUST_LOG: "info"
  OSF_NATS_URL: "nats://nats:4222"
  OSF_KEYS_MODE: "http"
  OSF_CONTROL_URL: "http://control:8083"
