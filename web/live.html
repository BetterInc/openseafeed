<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenSeaFeed — live</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: #0b1420; color: #cfe3f5;
         font: 14px/1.45 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: baseline;
           padding: .7rem 1rem; border-bottom: 1px solid #1d3242; }
  h1 { font-size: 1rem; font-weight: 600; letter-spacing: .04em; color: #7fd4a8; }
  .stat b { color: #fff; font-variant-numeric: tabular-nums; }
  .stat span, label { color: #7f9ab0; }
  #controls { margin-left: auto; display: flex; gap: .75rem; align-items: center; }
  input[type=text] { background: #0e1b2a; color: #cfe3f5; border: 1px solid #24455f;
          border-radius: 4px; padding: .25rem .5rem; width: 13rem; font: inherit; }
  button { background: #14532d; color: #d6ffe4; border: 1px solid #1f7a44; border-radius: 4px;
           padding: .25rem .9rem; font: inherit; cursor: pointer; }
  button:hover { background: #1a6b3a; }
  #map { flex: 1; }
  .maplibregl-popup-content { background: #0e1b2a; color: #cfe3f5; border: 1px solid #24455f;
      font: 13px/1.5 system-ui, sans-serif; padding: .6rem .8rem; }
  .maplibregl-popup-tip { border-top-color: #24455f; }
  .maplibregl-popup-content b { color: #7fd4a8; }
  #legend { position: absolute; bottom: 2.2rem; left: .75rem; z-index: 5;
            background: rgba(11,20,32,.85); border: 1px solid #1d3242; border-radius: 6px;
            padding: .5rem .75rem; color: #7f9ab0; font-size: 12px; }
  #legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
              margin-right: .35rem; vertical-align: -1px; }
</style>
</head>
<body>
<header>
  <h1>OPENSEAFEED LIVE</h1>
  <div class="stat"><b id="rate">0</b> <span>msg/s</span></div>
  <div class="stat"><b id="total">0</b> <span>messages</span></div>
  <div class="stat"><b id="vessels">0</b> <span>vessels seen</span></div>
  <div class="stat"><span id="status">disconnected</span></div>
  <div id="controls">
    <label><input type="checkbox" id="seamarks"> seamarks</label>
    <input type="text" id="key" value="osf_live_devdevdev" title="API key">
    <button id="go">connect</button>
  </div>
</header>
<div id="map"></div>
<div id="legend">
  <span style="color:#7fd4a8">&#9650;</span> under way (points along course)&ensp;
  <i style="background:#7fd4a8"></i>stationary<br>
  color = freshness:
  <i style="background:#7fd4a8"></i>&lt;10 s&ensp;
  <i style="background:#3f7d97"></i>&lt;2 min&ensp;
  <i style="background:#27455c"></i>older
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
"use strict";
const map = new maplibregl.Map({
  container: "map",
  center: [10, 55],
  zoom: 4,
  attributionControl: { compact: true },
  style: {
    version: 8,
    sources: {
      base: {
        type: "raster",
        tiles: ["https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png"],
        tileSize: 256,
        attribution: "&copy; OpenStreetMap contributors &copy; CARTO &middot; seamarks &copy; OpenSeaMap",
      },
      seamark: {
        type: "raster",
        tiles: ["https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png"],
        tileSize: 256,
      },
      vessels: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
    },
    layers: [
      { id: "base", type: "raster", source: "base" },
      { id: "seamark", type: "raster", source: "seamark",
        layout: { visibility: "none" } },
      // Stationary vessels: dots. Freshness: bright green fading toward
      // the deep blue of the sea.
      { id: "vessels", type: "circle", source: "vessels",
        filter: ["!=", ["get", "moving"], 1],
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 3, 1.6, 8, 3.5, 12, 6],
          "circle-color": ["step", ["get", "age"], "#7fd4a8", 10, "#3f7d97", 120, "#27455c"],
          "circle-opacity": 0.95,
        } },
      // Under-way vessels: arrows rotated to course over ground.
      { id: "vessels-moving", type: "symbol", source: "vessels",
        filter: ["==", ["get", "moving"], 1],
        layout: {
          "icon-image": "arrow",
          "icon-size": ["interpolate", ["linear"], ["zoom"], 3, 0.35, 8, 0.6, 12, 1.0],
          "icon-rotate": ["get", "rot"],
          "icon-rotation-alignment": "map",
          "icon-allow-overlap": true,
          "icon-ignore-placement": true,
        },
        paint: {
          "icon-color": ["step", ["get", "age"], "#7fd4a8", 10, "#3f7d97", 120, "#27455c"],
        } },
    ],
  },
});

// North-pointing arrow, generated at runtime as an SDF so icon-color tints
// it per-vessel.
map.on("load", () => {
  const s = 48, c = document.createElement("canvas");
  c.width = c.height = s;
  const g = c.getContext("2d");
  g.fillStyle = "#fff";
  g.beginPath();
  g.moveTo(s / 2, 5);        // tip
  g.lineTo(s - 11, s - 8);   // starboard tail
  g.lineTo(s / 2, s - 16);   // notch
  g.lineTo(11, s - 8);       // port tail
  g.closePath();
  g.fill();
  map.addImage("arrow", g.getImageData(0, 0, s, s), { sdf: true });
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }));

document.getElementById("seamarks").onchange = (e) =>
  map.setLayoutProperty("seamark", "visibility", e.target.checked ? "visible" : "none");

const seen = new Map(); // mmsi -> {lon, lat, t(ms), name, sog, cog, type}
let total = 0, windowCount = 0;
let ws = null;

function refresh() {
  const now = Date.now();
  const features = [];
  for (const [mmsi, v] of seen) {
    // Under way = making way over ground with a usable direction; heading
    // beats course when both exist (it's what the ship actually points at).
    const rot = v.heading != null ? v.heading : v.cog;
    const moving = v.sog != null && v.sog >= 0.5 && rot != null ? 1 : 0;
    features.push({
      type: "Feature",
      geometry: { type: "Point", coordinates: [v.lon, v.lat] },
      properties: { mmsi, age: (now - v.t) / 1000, name: v.name || "",
                    sog: v.sog, cog: v.cog, type: v.type, moving, rot: rot || 0 },
    });
  }
  const src = map.getSource("vessels");
  if (src) src.setData({ type: "FeatureCollection", features });
  document.getElementById("rate").textContent = windowCount;
  windowCount = 0;
  document.getElementById("total").textContent = total.toLocaleString();
  document.getElementById("vessels").textContent = seen.size.toLocaleString();
}
setInterval(refresh, 1000);

for (const layer of ["vessels", "vessels-moving"]) {
  map.on("click", layer, (e) => {
    const p = e.features[0].properties;
    const esc = (s) => String(s).replace(/[<>&]/g, "");
    new maplibregl.Popup()
      .setLngLat(e.features[0].geometry.coordinates)
      .setHTML(
        `<b>${esc(p.name) || "unnamed"}</b><br>` +
        `MMSI ${esc(p.mmsi)}<br>` +
        (p.moving == 1
          ? `${esc(p.sog)} kn, course ${Math.round(p.rot)}&deg;<br>`
          : `stationary<br>`) +
        `${esc(p.type)} &middot; ${Math.round(p.age)}s ago`
      )
      .addTo(map);
  });
  map.on("mouseenter", layer, () => (map.getCanvas().style.cursor = "pointer"));
  map.on("mouseleave", layer, () => (map.getCanvas().style.cursor = ""));
}

function connect() {
  if (ws) { ws.onclose = null; ws.close(); }
  const status = document.getElementById("status");
  ws = new WebSocket(`ws://${location.host}/v1/stream`);
  status.textContent = "connecting…";
  ws.onopen = () => {
    status.textContent = "streaming";
    ws.send(JSON.stringify({
      APIKey: document.getElementById("key").value.trim(),
      BoundingBoxes: [[[-90, -180], [90, 180]]],
    }));
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.error) { status.textContent = "error: " + m.error; return; }
    total++; windowCount++;
    const md = m.MetaData || {};
    if (typeof md.latitude !== "number" || (!md.latitude && !md.longitude)) return;
    const prev = seen.get(md.MMSI) || {};
    const pkt = m.Message ? m.Message[m.MessageType] || {} : {};
    const heading = typeof pkt.TrueHeading === "number" && pkt.TrueHeading < 511
      ? pkt.TrueHeading : undefined;
    seen.set(md.MMSI, {
      lon: md.longitude, lat: md.latitude, t: Date.now(),
      name: md.ShipName || prev.name,
      sog: typeof pkt.Sog === "number" && pkt.Sog < 102.3 ? pkt.Sog : prev.sog,
      cog: typeof pkt.Cog === "number" && pkt.Cog < 360 ? pkt.Cog : prev.cog,
      heading: heading !== undefined ? heading : prev.heading,
      type: m.MessageType,
    });
  };
  ws.onclose = () => { status.textContent = "disconnected — retrying in 3s"; setTimeout(connect, 3000); };
}
document.getElementById("go").onclick = connect;
connect();
</script>
</body>
</html>
