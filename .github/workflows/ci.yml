name: CI

on:
  push:
    branches: [main]
    # Release tags exist so the multi-arch build has somewhere to live that is
    # not the deploy path - see the platforms: comment in the docker job.
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR builds, but never a main push: that would abort the
  # deploy job mid-rollout and leave the namespace on a mix of image tags.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: rust
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/betterinc/openseafeed
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Only need registry credentials when we actually push: main or a v* tag.
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Publish from main pushes AND release tags; PRs build only.
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          # amd64 only on the deploy path. arm64 used to be built on every main
          # push, which meant cross-compiling this Rust workspace under QEMU -
          # measured at over 50 minutes, and the deploy job waits on it. The
          # Kapsule nodes are amd64, so none of that time bought anything for
          # production.
          #
          # arm64 still matters for the self-host route in docs/production.md,
          # so it is built for release tags, where a slow build is fine.
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Roll the workloads on the shared Kapsule cluster. The Deployments,
  # StatefulSets, Services, Ingresses and ConfigMaps are all owned by the infra
  # repo (projects-infrastructure modules/openseafeed), which sets
  # lifecycle.ignore_changes on every image field precisely so this job owns the
  # tag. CI never creates or deletes objects here - it only re-points images.
  deploy:
    name: Deploy to Kapsule
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production # gates KUBECONFIG to this job
    permissions:
      contents: read
    env:
      # Matches `type=sha,format=long` from the docker job's metadata step.
      IMAGE: ghcr.io/betterinc/openseafeed
      TAG: sha-${{ github.sha }}
    steps:
      - name: Guard - KUBECONFIG present?
        id: guard
        env:
          KC: ${{ secrets.KUBECONFIG }}
        run: |
          if [[ -z "$KC" ]]; then
            echo "::warning::KUBECONFIG not set on the production env - skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install kubectl
        if: steps.guard.outputs.skip != 'true'
        uses: azure/setup-kubectl@v4
        with: { version: v1.34.0 }

      - name: Write kubeconfig
        if: steps.guard.outputs.skip != 'true'
        env:
          KC: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          if echo "$KC" | base64 -d 2>/dev/null | grep -q "apiVersion"; then
            echo "$KC" | base64 -d > ~/.kube/config
          else
            printf '%s' "$KC" > ~/.kube/config
          fi
          chmod 600 ~/.kube/config

      # archiver first: it applies the ClickHouse schema migrations at startup,
      # so a schema-changing release must land there before the services that
      # read through it.
      - name: Roll archiver, then the rest
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          IMG="${IMAGE}:${TAG}"
          NS=openseafeed

          roll() { # roll <deployment> <container>
            kubectl -n "$NS" set image "deployment/$1" "$2=$IMG"
            kubectl -n "$NS" rollout status "deployment/$1" --timeout=300s
          }

          roll archiver archiver
          roll pipeline pipeline
          roll ingest ingest
          roll fanout fanout
          roll snapshotter snapshotter
          roll control control
          roll worker-norway worker
          roll worker-finland worker

          # dma-import ships at 0 replicas (see var.dma_import_replicas), so
          # there is nothing to wait for - just keep its image current for
          # whenever it is scaled up.
          kubectl -n "$NS" set image deployment/dma-import dma-import="$IMG"

      # /healthz returns a bare "ok" with no version field, so the real proof
      # that the new image is live is `rollout status` above. This just confirms
      # the public endpoints answer afterwards.
      - name: Smoke-test the public endpoints
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for url in https://api.openseafeed.com/healthz \
                     https://stream.openseafeed.com/healthz; do
            for i in $(seq 1 12); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
              echo "[$i/12] $url -> $CODE"
              [[ "$CODE" == "200" ]] && break
              if [[ $i == 12 ]]; then
                echo "::error::$url never returned 200"; exit 1
              fi
              sleep 5
            done
          done

  # ── openseafeed.com (Cloudflare Pages) ──────────────────────────────────
  # Deploys the static site in frontend/ via wrangler direct upload. Skips
  # with a warning until CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo
  # secrets exist (same guard pattern as KUBECONFIG above).
  pages:
    name: Deploy site to Cloudflare Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Guard - Cloudflare credentials present?
        id: guard
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set - skipping Pages deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy frontend/ to Pages project "openseafeed"
        if: steps.guard.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project list | grep -q '^ *openseafeed ' \
            || npx --yes wrangler@4 pages project create openseafeed --production-branch main
          npx --yes wrangler@4 pages deploy frontend --project-name openseafeed --branch main
