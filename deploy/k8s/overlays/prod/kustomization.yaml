apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml

# Pin the image to an immutable tag in prod. Bump this on release; CI publishes
# ghcr.io/openseafeed/openseafeed:<git-sha> and :latest on main.
images:
  - name: ghcr.io/openseafeed/openseafeed
    newTag: latest
