# OpenSeaFeed — local development stack.
#
#   make dev        # build + start everything
#   make dev-logs   # follow logs
#   make dev-down   # stop & remove
#
# The `norway-feed` worker is behind the `feeds` profile so it is opt-in:
#   docker compose --profile feeds up -d norway-feed
#
# All app services share one image (built from ./Dockerfile) and select their
# binary via `command`. Ports are published to localhost only.

x-app-env: &app-env
  RUST_LOG: ${RUST_LOG:-info}
  OSF_NATS_URL: nats://nats:4222
  OSF_KEYS_MODE: ${OSF_KEYS_MODE:-dev}
  OSF_CONTROL_URL: http://control:8083
  OSF_INTERNAL_TOKEN: ${OSF_INTERNAL_TOKEN:-dev-internal-token}

services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"   # client
      - "127.0.0.1:8222:8222"   # monitoring
    healthcheck:
      # NATS monitoring endpoint; /healthz reports JetStream readiness.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  ingest:
    build: .
    image: openseafeed:dev
    command: ["openseafeed-ingest"]
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:10110:10110/udp"   # NMEA over UDP
      - "127.0.0.1:10111:10111"       # NMEA over TCP
      - "127.0.0.1:8080:8080"         # HTTP: WS /v1/ingest, /healthz, /metrics
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  pipeline:
    build: .
    image: openseafeed:dev
    command: ["openseafeed-pipeline"]
    environment:
      <<: *app-env
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  fanout:
    build: .
    image: openseafeed:dev
    command: ["openseafeed-fanout"]
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:8081:8081"         # HTTP: WS /v1/stream, /healthz
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  snapshotter:
    build: .
    image: openseafeed:dev
    command: ["openseafeed-snapshotter"]
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:8082:8082"         # HTTP: /v1/snapshot, /v1/vessels/{mmsi}, /healthz
    volumes:
      - snapshots:/data/snapshots
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  control:
    build: .
    image: openseafeed:dev
    command: ["openseafeed-control"]
    environment:
      <<: *app-env
      OSF_DB_PATH: /data/control/control.db
      # OAuth (leave unset for dev; set to enable real login flows):
      OSF_SESSION_SECRET: ${OSF_SESSION_SECRET:-dev-session-secret}
      OSF_GITHUB_CLIENT_ID: ${OSF_GITHUB_CLIENT_ID:-}
      OSF_GITHUB_CLIENT_SECRET: ${OSF_GITHUB_CLIENT_SECRET:-}
      OSF_GOOGLE_CLIENT_ID: ${OSF_GOOGLE_CLIENT_ID:-}
      OSF_GOOGLE_CLIENT_SECRET: ${OSF_GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:8083:8083"         # HTTP: accounts, OAuth, API keys
    volumes:
      - control:/data/control
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: osf
      CLICKHOUSE_USER: osf
      CLICKHOUSE_PASSWORD: osf-dev
    configs:
      # The image defaults to listening on [::]; on hosts/networks without
      # IPv6 every listener fails and :8123 never comes up.
      - source: clickhouse-listen
        target: /etc/clickhouse-server/config.d/listen.xml
    ulimits:
      # ClickHouse opens many files; the image warns/underperforms below this.
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "127.0.0.1:8123:8123"   # HTTP interface
    volumes:
      - clickhouse:/var/lib/clickhouse
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget prefers ::1 and the server
      # listens on IPv4 only (see the listen.xml config above).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  archiver:
    build: .
    image: openseafeed:dev
    command: ["openseafeed-archiver"]
    environment:
      <<: *app-env
      OSF_HTTP_ADDR: 0.0.0.0:8084
      OSF_CLICKHOUSE_URL: http://clickhouse:8123
      OSF_CLICKHOUSE_DB: osf
      OSF_CLICKHOUSE_USER: osf
      OSF_CLICKHOUSE_PASSWORD: osf-dev
    ports:
      - "127.0.0.1:8084:8084"   # HTTP: /healthz
    depends_on:
      nats:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8084/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --- Feed connectors -----------------------------------------------------
  # Each connector is a SEPARATE worker process: one per upstream feed, its own
  # feed key, pushing into the ingest endpoint. They are independent of the
  # platform and can run anywhere (a VPS, a Pi, someone else's cluster) — here
  # they just happen to share the compose network and target the local ingest.
  # All live behind the opt-in `feeds` profile:
  #   docker compose --profile feeds up -d
  # See docs/connectors.md.

  # Norway — Kystverket public TCP feed. No extra config.
  norway-feed:
    build: .
    image: openseafeed:dev
    profiles: ["feeds"]
    command:
      - openseafeed-worker
      - connect
      - --upstream
      - norway
      - --ingest
      - tcp://ingest:10111
      - --key
      - ${OSF_FEED_KEY_NORWAY:-osf_stn_devdevdev}
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      ingest:
        condition: service_healthy
    restart: unless-stopped

  # Finland — Digitraffic public MQTT/WSS feed. No extra config.
  finland-feed:
    build: .
    image: openseafeed:dev
    profiles: ["feeds"]
    command:
      - openseafeed-worker
      - connect
      - --upstream
      - finland
      - --ingest
      - tcp://ingest:10111
      - --key
      - ${OSF_FEED_KEY_FINLAND:-osf_stn_devdevdev}
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      ingest:
        condition: service_healthy
    restart: unless-stopped

  # Denmark — requires a per-user upstream address granted by DMA. Uncomment
  # Put OSF_DENMARK_ADDR + OSF_FEED_KEY_DENMARK in .env, then:
  #   docker compose --profile denmark up -d
  denmark-feed:
    build: .
    image: openseafeed:dev
    profiles: ["denmark"]
    command:
      - openseafeed-worker
      - connect
      - --upstream
      - denmark
      - --ingest
      - tcp://ingest:10111
      - --key
      - ${OSF_FEED_KEY_DENMARK:-osf_stn_devdevdev}
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      # The worker exits with instructions if this is unset (see .env.example).
      OSF_DENMARK_ADDR: ${OSF_DENMARK_ADDR:-}
    depends_on:
      ingest:
        condition: service_healthy
    restart: unless-stopped

  # aisstream.io — third-party aggregator. Requires your aisstream.io API key
  # (OSF_AISSTREAM_KEY in .env) in addition to your own feed key.
  # NOTE: contributing a third-party aggregator's feed is subject to that
  # provider's terms — you are responsible for having the right to do so.
  # Put OSF_AISSTREAM_KEY in .env, then:
  #   docker compose --profile aisstream up -d
  aisstream-feed:
    build: .
    image: openseafeed:dev
    profiles: ["aisstream"]
    command:
      - openseafeed-worker
      - connect
      - --upstream
      - aisstream
      - --ingest
      - tcp://ingest:10111
      - --key
      - ${OSF_FEED_KEY_AISSTREAM:-osf_stn_devdevdev}
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      # The worker exits with instructions if this is unset (see .env.example).
      OSF_AISSTREAM_KEY: ${OSF_AISSTREAM_KEY:-}
    depends_on:
      ingest:
        condition: service_healthy
    restart: unless-stopped

volumes:
  snapshots:
  control:
  clickhouse:

configs:
  clickhouse-listen:
    content: |
      <clickhouse>
        <listen_host>0.0.0.0</listen_host>
      </clickhouse>
