[package]
name = "openseafeed-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
openseafeed-nmea.workspace = true
openseafeed-ais.workspace = true
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rumqttc = { version = "0.24", features = ["websocket", "use-rustls"] }
# tokio-tungstenite pulls rustls but selects no crypto provider; we install
# the ring provider at startup so the WS/TLS paths don't panic at runtime.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
